name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    env:
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      PG_DATABASE: ${{ secrets.PG_DATABASE }}
      PG_HOST: ${{ secrets.PG_HOST }}
      PG_USER: ${{ secrets.PG_USER }}
      PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      PG_PORT: ${{ secrets.PG_PORT }}
      PG_TABLE_NAME_FIXTURES: "stg_fixtures"
      PG_TABLE_NAME_GW: "stg_gameweeks"
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    
    - name: Install uv and create virtual env
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        # Add uv to the PATH for subsequent steps
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH # Adjust if install path differs
        uv venv
        
    - name: Install Dependencies
      run: |
        source .venv/bin/activate
        uv pip install ".[dev]"
        uv pip list

    # - name: Lint with flake8
    #   run: |
    #     source .venv/bin/activate
    #     # Stop the build if there are Python syntax errors or undefined names
    #     flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    #     # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
    #     flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        source .venv/bin/activate
        pytest

  deploy-prefect-flow:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          # Add uv to the PATH for subsequent steps
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH # Adjust if install path differs
          uv venv

      - name: Install Dependencies
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          uv pip install "."
        
      - name: Configure Prefect
        run: |
          source .venv/bin/activate
          prefect config set PREFECT_API_URL=${{ secrets.PREFECT_API_URL }}
          prefect config set PREFECT_API_KEY=${{ secrets.PREFECT_API_KEY }}
      - name: Deploy Prefect Flow
        run: |
          source .venv/bin/activate
          prefect deploy --prefect-file src/prefect_files/prefect.yaml
