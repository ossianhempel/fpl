# Welcome to your prefect.yaml file! You can use this file for storing and managing
# configuration for deploying your flows. We recommend committing this file to source
# control along with your flow code.

# Generic metadata about this project
name: prefect
prefect-version: 3.2.2

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning this project in remote locations
# INFO: keep in mind that the files you want to use in the flow need to be pushed to the repo!!!! 
pull:
  - prefect.deployments.steps.git_clone:
      id: clone-step
      repository: https://github.com/ossianhempel/fpl.git
      branch: main
  - prefect.deployments.steps.pip_install_requirements:
      requirements_file: requirements.txt # TODO: use a prefect-specific reqs file with only the necessaries
      directory: "{{ clone-step.directory }}"
      stream_output: False

# the deployments section allows you to provide configuration for deploying flows
deployments:
  - name: fpl-pipeline-deployment
    version: null
    tags: ["fpl"]
    concurrency_limit: null
    description: null
    schedule: 
      cron: "0 0 * * 2"  # Every Tuesday at midnight
    entrypoint: src/prefect_files/flows/fpl_pipeline_flow.py:fpl_pipeline_flow # relative reference to a function decorated as a flow that exists on some filesystem
    parameters: {}
    work_pool:
      name: default
      work_queue_name: null
      job_variables:
        env:
          MINIO_ENDPOINT: "minio-yokckg4o44wg40wogk0okgks.65.108.88.160.sslip.io"
          MINIO_ACCESS_KEY: "minio-fpl"
          MINIO_SECRET_KEY: "{{ prefect.blocks.secret.fpl-minio-secret-key }}"
    enforce_parameter_schema: true